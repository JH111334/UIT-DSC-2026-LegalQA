[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uit-legalqa"
version = "0.1.0"
description = "Retrieval-first Vietnamese LegalQA pipeline for UIT DSC 2026"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "PyYAML>=6.0"]

[project.optional-dependencies]
retrieval = ["faiss-cpu>=1.8", "sentence-transformers>=5.4"]
generation = ["accelerate>=0.33", "peft>=0.12", "torch>=2.2", "transformers>=4.41"]
training = ["accelerate>=0.33", "bitsandbytes>=0.43", "peft>=0.12", "torch>=2.2", "transformers>=4.41"]
eval = ["nltk>=3.9", "rouge-score>=0.1.2"]
dev = ["pytest>=8.0"]

[project.scripts]
legalqa = "legalqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "Source/Shared", "Source/Task1", "Source/Task2"]
