seed: 2026

data:
  data_dir: "LegalQA - Public Test"
  train_file: train.json
  test_file: public-official.json
  contexts_path: "selected-contexts"
  artifacts_dir: artifacts/corpus_v2

audit:
  very_long_chars: 200000
  extreme_chars: 1000000
  min_structure_density_per_10k: 0.25
  near_duplicate_enabled: true
  near_duplicate_threshold: 0.94

sanitation:
  enabled: true
  version: corpus-v2.1
  blacklist_path: configs/preprocessing/boilerplate_blacklist.yaml
  protected_patterns_path: configs/preprocessing/protected_patterns.yaml
  review_policy_path: configs/preprocessing/boilerplate_review_policy.yaml
  terminal_noi_nhan_min_ratio: 0.85
  block_min_chars: 100
  overlap_min_tokens: 12
  overlap_max_tokens: 50000
  remove_retrieval_boilerplate: true
  recover_paywall_documents: true
  df_line_min_chars: 20
  df_line_max_chars: 500
  df_min_ratio: 0.01
  df_max_candidates: 500
  local_repetition_flag_ratio: 0.20
  local_max_tf_flag: 5

chunking:
  legal_aware: true
  max_chars: 1800
  overlap_chars: 220
  min_chars: 60
  preamble_chars: 1400

# This config deliberately measures pure BM25: no dense, metadata boost or
# lexical/cross-encoder reranking. Later hybrid experiments get separate files.
retrieval:
  bm25_enabled: true
  dense_enabled: false
  bm25_top_k: 100
  dense_top_k: 100
  rrf_top_k: 50
  rrf_constant: 60
  legal_metadata_boost: 0.0
  rerank_enabled: false
  rerank_top_k: 50

complexity:
  enabled: false
  complexity_top_k: [3, 5, 8]
  confidence_enabled: false

expansion:
  parent_enabled: false
  graph_enabled: false

models:
  parameter_limit_b: 4.0
  dense: {enabled: false, backend: none}
  reranker: {enabled: false, backend: lexical}
  generator: {enabled: false, backend: extractive}

diagnostic:
  enabled: true
  allow_training_use: false
  manual_sample_size: 150
  seed: 2026
