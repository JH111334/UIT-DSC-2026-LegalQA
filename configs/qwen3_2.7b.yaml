seed: 2026
data:
  data_dir: "LegalQA - Public Test"
  train_file: train.json
  test_file: public-official.json
  contexts_zip: selected-contexts.zip
  artifacts_dir: artifacts/qwen3_2.7b
audit:
  very_long_chars: 200000
  extreme_chars: 1000000
  min_structure_density_per_10k: 0.25
  near_duplicate_enabled: true
  near_duplicate_threshold: 0.94
chunking:
  legal_aware: true
  max_chars: 1800
  overlap_chars: 220
  min_chars: 60
retrieval:
  bm25_enabled: true
  dense_enabled: true
  bm25_top_k: 100
  dense_top_k: 100
  rrf_top_k: 50
  rrf_constant: 60
  legal_metadata_boost: 0.12
  rerank_enabled: true
  rerank_top_k: 50
complexity:
  enabled: true
  complexity_top_k: [3, 5, 8]
  confidence_enabled: true
  confident_gap: 0.20
  ambiguous_gap: 0.05
  confident_max_k: 3
  ambiguous_min_k: 5
expansion:
  parent_enabled: true
  graph_enabled: true
  graph_max_per_seed: 2
  graph_decay: 0.72
evidence:
  max_chars: 12000
  max_per_document: 3
  parent_max_chars: 5000
  min_score_ratio: 0.35
models:
  parameter_limit_b: 4.0
  dense:
    name_or_path: Qwen/Qwen3-Embedding-0.6B
    parameters_b: 0.6
    backend: sentence_transformers
    enabled: true
    local_files_only: true
    batch_size: 16
    max_length: 8192
  reranker:
    name_or_path: Qwen/Qwen3-Reranker-0.6B
    parameters_b: 0.6
    backend: cross_encoder
    enabled: true
    local_files_only: true
    batch_size: 8
    max_length: 4096
  generator:
    name_or_path: Qwen/Qwen2.5-1.5B-Instruct
    parameters_b: 1.5
    backend: transformers
    enabled: true
    local_files_only: true
    max_length: 8192
diagnostic:
  enabled: true
  allow_training_use: false
  manual_sample_size: 150
generation:
  max_new_tokens: 512
  do_sample: false
  temperature: 0.2
  repetition_penalty: 1.05

