config_version = "task1-benchmark-v2"
task = "LegalIR"
official_metric = "macro_recall"
official_tie_breaker = "macro_precision"
max_predicted_document_ids = 5
local_diagnostics = ["recall", "precision", "recall_at_k", "mrr", "ndcg_at_k", "latency_ms"]

[data]
source = "Task1_only"
cross_task_data_allowed = false
external_data_allowed = false
augmentation_allowed = false
drop_empty_train_passages = true
deduplicate_train_passages = true

[candidate_generation]
sparse = ["bm25", "tfidf"]
dense_model = "AITeamVN/Vietnamese_Embedding_v2"
dense_enabled = false
candidate_k = 100

[fusion]
method = "rrf"
preserve_component_scores = true

[reranking]
model = "AITeamVN/Vietnamese_Reranker"
enabled = false
rerank_k = 30

[hardware]
profile = "rtx-2050-4gb"
run_models_sequentially = true
total_parameter_limit_exclusive = 4000000000
