name: ci

on:
  push:
    branches:
      - "main"
      - "Task1-LegalIR"
      - "Task2-LegalQA"
      - "Data-Evaluation"
      - "Integration-Submission"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.10.7
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov=text_retrieval_agent --cov-report=term-missing
      - run: uv run python skills/retrieval-delivery/scripts/validate_project.py
